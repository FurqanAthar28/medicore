<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ HOSPITAL_NAME }} - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f1c2e; min-height: 100vh; display: flex; align-items: center; }
        .login-card { border-radius: 12px; border: none; box-shadow: 0 10px 40px rgba(0,0,0,0.3); }
        .brand { color: #fff; font-size: 2rem; font-weight: 700; }
        .brand span { color: #3b9eff; }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="text-center mb-4">
                <div class="brand">Medi<span>Core</span></div>
                <p class="text-secondary">Hospital Management System</p>
            </div>
            <div class="card login-card p-4">
                <h5 class="mb-4 text-center fw-semibold">Sign In</h5>
                <form method="POST">
                    {% csrf_token %}
                    {% for field in form %}
                    <div class="mb-3">
                        <label class="form-label small fw-semibold" for="{{ field.id_for_label }}">{{ field.label }}</label>
                        <input type="{{ field.field.widget.input_type }}"
                               name="{{ field.html_name }}"
                               id="{{ field.id_for_label }}"
                               class="form-control"
                               placeholder="{{ field.label }}"
                               {% if field.field.widget.input_type != 'password' and field.value %}value="{{ field.value }}"{% endif %}
                               autocomplete="{% if field.field.widget.input_type == 'password' %}current-password{% else %}username{% endif %}"
                               required>
                        {% if field.errors %}
                        <div class="text-danger small mt-1">{{ field.errors }}</div>
                        {% endif %}
                    </div>
                    {% endfor %}
                    {% if form.non_field_errors %}
                    <div class="alert alert-danger small">{{ form.non_field_errors }}</div>
                    {% endif %}
                    <input type="hidden" name="next" value="{{ next }}">
                    <button class="btn btn-primary w-100 mt-2">Login</button>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
